<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>R2B - Espace Chef</title>

    <style>

        body {
            font-family: Calibri, sans-serif;
            padding: 20px;
            background: #f4f6f9;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #000;
            margin-top: 60px;
        }

        .icon-hamburger {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #000;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            font-size: 1.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .badge-rouge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            margin-top: 25px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button.btn-block {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .page-gestion {
            display: none;
            background: #fff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-top: 20px;
            border: 1px solid #ddd;
        }

        .list-item {
            background: #f8f9fa;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-del {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .card-notif-client {
            background: #fff5f5;
            border-left: 6px solid #e53e3e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .action-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            cursor: pointer;
            min-width: 120px;
        }

        .btn-call {
            background: #007bff;
        }

        .btn-wa-action {
            background: #25D366;
        }

        .message-vide {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

    </style>

</head>

<body>

    <!-- MENU -->

    <button
        class="icon-hamburger"
        onclick="ouvrirPageGestion()">

        ☰

        <div
            id="admin-badge"
            class="badge-rouge"
            style="display:none;">

            0

        </div>

    </button>


    <h1>
        R2B - Ajouter un Terrain
    </h1>


    <!-- AJOUT TERRAIN -->

    <div class="box">

        <label>
            Superficie
        </label>

        <input
            type="text"
            id="sup"
            placeholder="Ex: 500 m²">


        <label>
            Localisation
        </label>

        <input
            type="text"
            id="loc"
            placeholder="Ex: Karakoro">


        <label>
            Prix en FCFA
        </label>

        <input
            type="text"
            id="prix"
            placeholder="Ex: 7500000">


        <button
            class="btn-block"
            onclick="ajouterTerrain()">

            Mettre en ligne le terrain

        </button>

    </div>


    <!-- GESTION -->

    <div
        id="page-gestion-container"
        class="page-gestion">

        <h2 style="color:red;">
            🚨 Nouvelles Commandes Clients
        </h2>

        <div id="liste-commandes-reçues"></div>


        <h2 style="margin-top:40px;">
            📦 Liste de vos Terrains en Vente
        </h2>

        <div id="liste-terrains-gestion"></div>

    </div>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <script>

        /* ===============================
           FIREBASE
        =============================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyA49jSfi5m_aSDUDOSE5s66mwoFF6Bj8FU",

            authDomain:
                "r2b-entreprise.firebaseapp.com",

            databaseURL:
                "https://r2b-entreprise-default-rtdb.firebaseio.com",

            projectId:
                "r2b-entreprise",

            storageBucket:
                "r2b-entreprise.firebasestorage.app",

            messagingSenderId:
                "614614560237",

            appId:
                "1:614614560237:web:6ca754bde319f587590be4"

        };


        firebase.initializeApp(firebaseConfig);

        const database =
            firebase.database();


        /* ===============================
           MENU
        =============================== */

        function ouvrirPageGestion() {

            const page =
                document.getElementById(
                    "page-gestion-container"
                );

            if (
                page.style.display === "block"
            ) {

                page.style.display = "none";

            } else {

                page.style.display = "block";

            }

        }


        /* ===============================
           AJOUTER TERRAIN
        =============================== */

        function ajouterTerrain() {

            const superficie =
                document.getElementById(
                    "sup"
                ).value.trim();

            const localisation =
                document.getElementById(
                    "loc"
                ).value.trim();

            const prix =
                document.getElementById(
                    "prix"
                ).value.trim();


            if (
                !superficie ||
                !localisation ||
                !prix
            ) {

                alert(
                    "Veuillez tout remplir !"
                );

                return;

            }


            database
                .ref("r2b_terrains")
                .push({

                    superficie:
                        superficie,

                    localisation:
                        localisation,

                    prix:
                        prix,

                    date:
                        new Date().toLocaleString(
                            "fr-FR"
                        )

                })

                .then(function() {

                    document.getElementById(
                        "sup"
                    ).value = "";

                    document.getElementById(
                        "loc"
                    ).value = "";

                    document.getElementById(
                        "prix"
                    ).value = "";

                    alert(
                        "Terrain ajouté en ligne avec succès !"
                    );

                })

                .catch(function(error) {

                    console.error(error);

                    alert(
                        "Erreur Firebase : " +
                        error.message
                    );

                });

        }


        /* ===============================
           TERRAINS
        =============================== */

        function chargerTerrains() {

            database
                .ref("r2b_terrains")
                .on("value", function(snapshot) {

                    const div =
                        document.getElementById(
                            "liste-terrains-gestion"
                        );

                    if (!div) return;

                    div.innerHTML = "";


                    if (!snapshot.exists()) {

                        div.innerHTML = `

                            <div class="message-vide">

                                Aucun terrain en vente.

                            </div>

                        `;

                        return;

                    }


                    let numero = 1;


                    snapshot.forEach(
                        function(child) {

                            const t =
                                child.val();


                            div.innerHTML += `

                                <div class="list-item">

                                    <span>

                                        <strong>
                                            Terrain ${numero}
                                        </strong>

                                        <br>

                                        📍
                                        ${echapperHTML(
                                            t.localisation
                                        )}

                                        <br>

                                        📐
                                        ${echapperHTML(
                                            t.superficie
                                        )}

                                        <br>

                                        💰
                                        ${echapperHTML(
                                            t.prix
                                        )}
                                        FCFA

                                    </span>


                                    <button
                                        class="btn-del"
                                        onclick="supprimerTerrain('${child.key}')">

                                        Retirer

                                    </button>

                                </div>

                            `;


                            numero++;

                        }
                    );

                });

        }


        /* ===============================
           SUPPRIMER TERRAIN
        =============================== */

        function supprimerTerrain(id) {

            if (
                !confirm(
                    "Voulez-vous retirer ce terrain ?"
                )
            ) {

                return;

            }


            database
                .ref(
                    "r2b_terrains/" + id
                )
                .remove()

                .then(function() {

                    alert(
                        "Terrain retiré du catalogue."
                    );

                })

                .catch(function(error) {

                    alert(
                        "Erreur : " +
                        error.message
                    );

                });

        }


        /* ===============================
           COMMANDES
        =============================== */

        function chargerCommandes() {

            database
                .ref("r2b_commandes")
                .on("value", function(snapshot) {

                    const div =
                        document.getElementById(
                            "liste-commandes-reçues"
                        );

                    const badge =
                        document.getElementById(
                            "admin-badge"
                        );

                    if (!div || !badge) return;

                    div.innerHTML = "";


                    if (!snapshot.exists()) {

                        badge.style.display = "none";

                        div.innerHTML = `

                            <div class="message-vide">

                                Aucune notification de commande.

                            </div>

                        `;

                        return;

                    }


                    let nombre = 0;


                    snapshot.forEach(
                        function(child) {

                            const c =
                                child.val();

                            nombre++;


                            const numeroWhatsApp =
                                String(
                                    c.whatsapp || ""
                                ).replace(
                                    /[^0-9]/g,
                                    ""
                                );


                            const numeroTelephone =
                                String(
                                    c.telephone || ""
                                ).replace(
                                    /[^0-9+]/g,
                                    ""
                                );


                            const texteWhatsApp =
                                encodeURIComponent(

                                    "Bonjour " +
                                    (c.nom || "") +
                                    ", R2B Entreprise a bien reçu votre commande pour le terrain situé à " +
                                    (c.localisation || "") +
                                    ". Quand seriez-vous disponible pour une visite ?"

                                );


                            div.innerHTML += `

                                <div class="card-notif-client">

                                    <h3>
                                        🔴 Commande reçue
                                    </h3>

                                    <p>
                                        <strong>Client :</strong>
                                        ${echapperHTML(c.nom)}
                                    </p>

                                    <p>
                                        <strong>Appel :</strong>
                                        ${echapperHTML(c.telephone)}
                                    </p>

                                    <p>
                                        <strong>WhatsApp :</strong>
                                        ${echapperHTML(c.whatsapp)}
                                    </p>

                                    <p>
                                        <strong>Fixe :</strong>
                                        ${echapperHTML(c.fixe || "")}
                                    </p>

                                    <p>
                                        <strong>Autre :</strong>
                                        ${echapperHTML(c.autre || "")}
                                    </p>

                                    <p>
                                        <strong>Terrain :</strong>
                                        ${echapperHTML(c.localisation)}
                                    </p>

                                    <p>
                                        <strong>Superficie :</strong>
                                        ${echapperHTML(c.superficie || "")}
                                    </p>

                                    <p>
                                        <strong>Prix :</strong>
                                        ${echapperHTML(c.prix)}
                                        FCFA
                                    </p>

                                    <p>
                                        <strong>Date :</strong>
                                        ${echapperHTML(c.date || "")}
                                    </p>


                                    <div class="action-box">

                                        <a
                                            href="tel:${numeroTelephone}"
                                            class="btn-action btn-call">

                                            📞 Appeler

                                        </a>


                                        <a
                                            href="https://wa.me/${numeroWhatsApp}?text=${texteWhatsApp}"
                                            target="_blank"
                                            class="btn-action btn-wa-action">

                                            💬 WhatsApp

                                        </a>


                                        <button
                                            class="btn-del"
                                            onclick="supprimerCommande('${child.key}')">

                                            Archiver

                                        </button>

                                    </div>

                                </div>

                            `;

                        }
                    );


                    badge.innerText =
                        nombre;

                    badge.style.display =
                        nombre > 0
                            ? "flex"
                            : "none";

                });

        }


        /* ===============================
           ARCHIVER
        =============================== */

        function supprimerCommande(id) {

            if (
                !confirm(
                    "Archiver cette commande ?"
                )
            ) {

                return;

            }


            database
                .ref(
                    "r2b_commandes/" + id
                )
                .remove()

                .catch(function(error) {

                    alert(
                        "Erreur : " +
                        error.message
                    );

                });

        }


        /* ===============================
           PROTECTION
        =============================== */

        function echapperHTML(texte) {

            const div =
                document.createElement("div");

            div.textContent =
                String(texte ?? "");

            return div.innerHTML;

        }


        /* ===============================
           CHARGEMENT
        =============================== */

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                chargerTerrains();

                chargerCommandes();

            }
        );

    </script>

</body>

    </html>
