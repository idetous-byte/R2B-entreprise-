<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>R2B Entreprise - Terrains</title>

    <link rel="stylesheet" href="Style.css">

    <style>

        body,
        button,
        input {
            font-family: 'Calibri', 'Segoe UI', sans-serif;
        }


        /* =====================================
           ÉCRAN DE DÉMARRAGE
        ===================================== */

        #splash-screen {

            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000000;

            z-index: 999999;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }


        #splash-screen.hidden {

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

        }


        .splash-box {

            border: 2px solid #ffffff;

            padding: 30px 45px;

            text-align: center;

            background: #000000;

            border-radius: 12px;

            box-shadow:
                0 0 25px rgba(255,255,255,0.25);

            min-width: 180px;

        }


        .splash-box h1 {

            margin: 0;

            color: #ffffff;

            font-size: 55px;

            font-weight: bold;

            letter-spacing: 5px;

        }


        .splash-divider {

            width: 80px;
            height: 2px;

            background: #ffffff;

            margin: 12px auto;

        }


        .splash-box p {

            margin: 0;

            color: #ffffff;

            font-size: 22px;

            letter-spacing: 2px;

        }


        /* =====================================
           FENÊTRE DE COMMANDE

            touch-action: none;

        }
