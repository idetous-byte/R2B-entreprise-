<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R2B Entreprise - Terrains</title>

<link rel="stylesheet" href="Style.css">

<style>

    body,
    button,
    input {
        font-family: 'Calibri', 'Segoe UI', sans-serif;
    }


    /* =====================================
       ÉCRAN DE DÉMARRAGE R2B
       ===================================== */

    #splash-screen {

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100vh;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #000000;

        z-index: 99999;

        opacity: 1;

        visibility: visible;

        transition: opacity 0.5s ease;

        font-family: 'Calibri', 'Segoe UI', sans-serif;
    }


    .splash-box {

        border: 2px solid #ffffff;

        padding: 30px 45px;

        text-align: center;

        background: #000000;

        border-radius: 12px;

        box-shadow:
            0 0 25px rgba(255,255,255,0.25);

        min-width: 180px;
    }


    .splash-box h1 {

        margin: 0;

        color: #ffffff;

        font-family: 'Calibri', 'Segoe UI', sans-serif;

        font-size: 55px;

        font-weight: bold;

        letter-spacing: 5px;
    }


    .splash-divider {

        width: 80px;

        height: 2px;

        background: #ffffff;

        margin: 12px auto;
    }


    .splash-box p {

        margin: 0;

        color: #ffffff;

        font-family: 'Calibri', 'Segoe UI', sans-serif;

        font-size: 22px;

        font-weight: normal;

        letter-spacing: 2px;
    }


    /* =====================================
       FENÊTRE FLOTTANTE
       ===================================== */

    .fenetre-flottante {

        display: none;

        position: fixed;

        top: 15%;
        left: 5%;

        width: 90%;

        max-width: 360px;

        background: #ffffff;

        border: 2px solid #000000;

        border-radius: 12px;

        box-shadow:
            0 10px 30px rgba(0,0,0,0.4);

        z-index: 10005;

        touch-action: none;
    }


    .barre-deplacement {

        background: #000000;

        color: #ffffff;

        padding: 12px;

        cursor: move;

        font-weight: bold;

        display: flex;

        justify-content: space-between;

        align-items: center;

        user-select: none;
    }


    .bouton-fermer {

        cursor: pointer;

        font-size: 1.5rem;

        padding: 0 5px;
    }


    .contenu-formulaire {

        padding: 15px;
    }


    .details-terrain-choisi {

        background: #f8f9fa;

        padding: 8px 12px;

        border-radius: 6px;

        margin-bottom: 12px;

        font-size: 0.95rem;

        border-left: 4px solid #000;
    }


    .ligne-saisie {

        margin-bottom: 10px;
    }


    .ligne-saisie label {

        display: block;

        font-size: 0.9rem;

        font-weight: bold;

        margin-bottom: 3px;
    }


    .ligne-saisie input {

        width: 100%;

        padding: 8px;

        border: 1px solid #ccc;

        border-radius: 6px;

        box-sizing: border-box;
    }


    .btn-soumettre {

        width: 100%;

        background: #000000;

        color: #ffffff;

        border: none;

        padding: 12px;

        border-radius: 6px;

        font-weight: bold;

        text-transform: uppercase;

        cursor: pointer;
    }

</style>

</head><body><!-- =====================================
     ÉCRAN DE DÉMARRAGE
     ===================================== -->

<div id="splash-screen">

    <div class="splash-box">

        <h1>R2B</h1>

        <div class="splash-divider"></div>

        <p>Entreprise</p>

    </div>

</div>


<!-- =====================================
     PANIER
     ===================================== -->

    🛒

    <span id="cart-count">

    </span>

</div>


<!-- =====================================
     EN-TÊTE
     ===================================== -->

<header>

    <div class="main-header-title">

    </div>


    <p class="main-subtitle">

        Construisez l'avenir dans le présent
        en achetant des terrains à très bon prix.

    </p>

</header>


<!-- =====================================
     TERRAINS
     ===================================== -->

<main>

    <div

    </div>

</main>


<!-- =====================================
     FENÊTRE DE COMMANDE
     ===================================== -->

    <div

        <span

    <div class="contenu-formulaire">

        <div class="ligne-saisie">

            <input

        <div class="ligne-saisie">

            </label>

        <div class="ligne-saisie">

     IMPORTANT : AVANT Script.js
     ===================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<!-- =====================================
     SCRIPT PRINCIPAL
     ===================================== -->

<script src="Script.js"></script>


<!-- =====================================
     DÉPLACEMENT DE LA FENÊTRE
     ===================================== -->

<script>

    const el =
        document.getElementById(
            "popup-commande"
        );


    const barre =
        document.getElementById(
            "barre-tactile"
        );


    let estEnTrainDeGlisser = false;


    let xInitial = 0;

    let yInitial = 0;


    let xActuel = 0;

    let yActuel = 0;


    if (barre) {

        barre.addEventListener(
            "touchstart",
            function(e) {

                estEnTrainDeGlisser = true;

                xInitial =
                    e.touches[0].clientX
                    - xActuel;

                yInitial =
                    e.touches[0].clientY
                    - yActuel;

            },
            {
                passive: true
            }
        );


        document.addEventListener(
            "touchmove",
            function(e) {

                if (!estEnTrainDeGlisser) return;

                xActuel =
                    e.touches[0].clientX
                    - xInitial;

                yActuel =
                    e.touches[0].clientY
                    - yInitial;


                if (el) {

                    el.style.transform =
                        `translate3d(
                            ${xActuel}px,
                            ${yActuel}px,
                            0
                        )`;

                }

            },
            {
                passive: false
            }
        );


        document.addEventListener(
            "touchend",
            function() {

                estEnTrainDeGlisser = false;

            }
        );


        barre.addEventListener(
            "mousedown",
            function(e) {

                estEnTrainDeGlisser = true;

                xInitial =
                    e.clientX - xActuel;

                yInitial =
                    e.clientY - yActuel;

            }
        );


        document.addEventListener(
            "mousemove",
            function(e) {

                if (!estEnTrainDeGlisser) return;

                xActuel =
                    e.clientX - xInitial;

                yActuel =
                    e.clientY - yInitial;


                if (el) {

                    el.style.transform =
                        `translate3d(
                            ${xActuel}px,
                            ${yActuel}px,
                            0
                        )`;

                }

            }
        );


        document.addEventListener(
            "mouseup",
            function() {

                estEnTrainDeGlisser = false;

            }
        );

    }

</script>

</body></html>
